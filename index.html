<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GTD Data Room</title>
  <!-- Group 01 BangKuBehind, EA234506 Assignment 2: immersive, view-only version.
       Nothing in this scene reacts to the viewer. The viewer can only move their own
       viewpoint (head turn, step; WASD + mouse drag on desktop, touch-drag on phone). -->
  <script src="vendor/aframe-v1.7.0.min.js"></script>
  <script src="scene.js?v=17" defer></script>
  <style>
    html, body { margin: 0; height: 100%; background: #eef1f4; font-family: system-ui, sans-serif; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #33404d; font-size: 16px; }
  </style>
</head>
<body>
  <div id="loading">Loading the data room…</div>
  <a-scene renderer="antialias: true; colorManagement: true" background="color: #e3e8ee"
           vr-mode-ui="enabled: true" loading-screen="enabled: false">
    <a-entity light="type: ambient; intensity: 0.75; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.7; color: #ffffff" position="2 6 3"></a-entity>

    <!-- floor -->
    <a-plane rotation="-90 0 0" width="30" height="30" color="#c9d2dc" material="shader: flat"></a-plane>

    <!-- HOME position: viewer stands at the origin, eye height 1.6 m, facing -Z (centre wall) -->
    <a-entity id="rig" position="0 0 0">
      <a-entity id="cam" camera="near: 0.05; far: 120" position="0 1.6 0" look-controls="pointerLockEnabled: false"
                wasd-controls="acceleration: 18"></a-entity>
    </a-entity>

    <!-- everything below is generated from scene-data.json by scene.js -->
    <a-entity id="room"></a-entity>
  </a-scene>
</body>
</html>
